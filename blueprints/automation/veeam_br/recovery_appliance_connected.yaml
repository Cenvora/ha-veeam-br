blueprint:
  name: Veeam recovery appliance connected
  description: >-
    Notify when a recovery appliance — a machine booted from Veeam Recovery Media — connects
    to the backup server, typically to run a bare-metal restore.

    On most servers that is rare, and one nobody expected is worth knowing about: it can read
    backups. Reacts to the integration's `veeam_br_recovery_appliance_connected` event, so
    there is no entity to pick. Appliances already connected when Home Assistant starts are not
    announced; one that disconnects and reconnects is.

    Requires Veeam B&R 13.1 and the `1.3-rev2` API version.
  domain: automation
  source_url: https://github.com/Cenvora/ha-veeam-br/blob/main/blueprints/automation/veeam_br/recovery_appliance_connected.yaml
  author: Cenvora
  input:
    veeam_server:
      name: Veeam server
      description: Optional. Only notify about this server; leave empty for every server.
      default: ""
      selector:
        config_entry:
          integration: veeam_br
    notification_action:
      name: Notification action
      description: >-
        What to run. Available variables: `host`, `endpoint`, `addresses` (a list), `verified`
        (true, false, or none when the server does not say), `version`, `platform`,
        `appliance_id`, `entry_id`, `server_name`, and ready-made `title` and `message`.
      selector:
        action:

mode: queued
max: 10

triggers:
  - trigger: event
    event_type: veeam_br_recovery_appliance_connected

variables:
  veeam_server: !input veeam_server
  entry_id: "{{ trigger.event.data.entry_id }}"
  server_name: "{{ config_entry_attr(entry_id, 'title') or '' if entry_id else '' }}"
  appliance_id: "{{ trigger.event.data.id }}"
  host: "{{ trigger.event.data.host or 'An unnamed machine' }}"
  endpoint: "{{ trigger.event.data.endpoint or '' }}"
  addresses: "{{ trigger.event.data.addresses or [] }}"
  verified: "{{ trigger.event.data.verified }}"
  version: "{{ trigger.event.data.version or '' }}"
  platform: "{{ trigger.event.data.platform or '' }}"
  title: "Veeam: recovery appliance connected: {{ host }}"
  message: >-
    {{ host }}
    {%- if endpoint %} ({{ endpoint }}){% elif addresses %} ({{ addresses | join(', ') }}){% endif %}
    connected to {{ server_name or 'the backup server' }} from Veeam Recovery Media.
    {%- if verified is sameas true %} It is verified.
    {%- elif verified is sameas false %} It is not verified yet: check its verification phrase
    before trusting it.
    {%- endif %}

conditions:
  - condition: template
    value_template: "{{ not veeam_server or entry_id == veeam_server }}"

actions: !input notification_action
